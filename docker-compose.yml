services:
  automation:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - sessions_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sessions_data:
